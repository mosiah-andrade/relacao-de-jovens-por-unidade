<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levantamento CJAS 2026 - Conselho Recife Norte</title>
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReVKnYo5TzTUaoXEBf9EjmVjjKVZjwMYEXqw&s" type="image/x-icon">
    <style>
        /* 1. Esconde a barra de rolagem global (Navegador) */
        html, body {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family:  'arial', sans-serif;
        }

        body::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .container {
            width: 90vw;
            background: white;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            text-align: center;
            margin-top: 20px;
            /* Garante que o container não crie scroll interno */
            overflow: hidden; 
        }

        .form-wrapper {
            position: relative;
            width: 100%;
            /* O segredo para o Google Forms não criar scroll interno: 
               dar um "respiro" na altura ou garantir que o iframe seja grande o suficiente */
            overflow: hidden; 
        }

        iframe {
            width: 100%;
            /* Aumentei ligeiramente a altura para garantir que o botão "Enviar" não seja cortado */
            height: 1400px; 
            border: none;
            /* Tira o scroll interno do iframe */
            overflow: hidden; 
        }
        span {
            display: block;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #f4f7f6;
            background-color: #34495e;
            padding: 10px 0;
            a{
                color: #f2d241;
                text-decoration: none;
                font-weight: bold;
            }
        }
        footer {
            margin: 20px 0;
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        /* Ajustes para Mobile */
        @media (max-width: 600px) {
            .container {
                padding: 10px;
                margin-top: 0;
                border-radius: 0;
                width: 100vw;
                box-shadow: none;
            }
            
            iframe {
                /* Formulários tendem a esticar no mobile, aumentamos a altura aqui */
                height: 1850px; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReVKnYo5TzTUaoXEBf9EjmVjjKVZjwMYEXqw&s" height="85px" style="margin-bottom: 15px;">
        
        <div class="form-wrapper">
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSdi0sBnkQfTMBM26HMIjlv2T6zlOp5L0nokDJQn2ujl8JBGsw/viewform?embedded=true" 
                width="100%"
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
                Carregando…
            </iframe>
        </div>

        <span>
            Entre em contato com a equipe de TI em caso de Erros ou Dúvidas
            whatsapp: <br><a href="https://wa.me/5581999999999" target="_blank">(81) 9 8928-9155</a>
        </span>
        <footer>
            Conselho Recife Norte &copy; 2026
        </footer>
    </div>

</body>
</html>
